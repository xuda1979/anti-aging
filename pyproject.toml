[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellular-rejuvenation-research"
version = "0.1.0"
description = "Reproducible public-data aging research pilots; no rejuvenation efficacy established"
requires-python = ">=3.11"
authors = [{name = "David Xu, PhD"}, {name = "Peter Lee, PhD, MD"}, {name = "Zhimin Zheng, PhD"}]
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0", "joblib==1.5.3", "matplotlib==3.10.8", "threadpoolctl==3.6.0"]

[tool.setuptools.packages.find]
where = ["src"]

