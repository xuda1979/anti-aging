[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-clock-ai"
version = "0.1.0"
description = "Reproducible pilots and a falsifiable research framework for cellular age resetting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
deep = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
